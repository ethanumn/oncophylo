[project]
name = "oncophylo"
version = "0.0.1"
authors = [
  { name="Ethan", email="kulma009@umn.edu" },
]
description = "A package to perform cancer phylogeny reconstruction analysis."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/pypa/sampleproject"
Issues = "https://github.com/pypa/sampleproject/issues"

[build-system]
requires = [
           "setuptools>=61.0", 
           "numpy>=1.21.0",
           "pandas>=2.0",
           "scipy>=1.1.0", 
           "kmodes>=0.12", 
           "networkx>=3.0",
           "pydot>=2.0",
           "gurobipy"]
build-backend = "setuptools.build_meta"